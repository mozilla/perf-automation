<html>
<head>
<script src=webcodecs-bench.js></script>
<script src=benchmarks.js></script>
<meta charset="utf-8">
<style>
  html {
    font-family: helvetica, arial;
  }
  table {
    margin: 1em;
    border-collapse: collapse;
  }
  thead {
    background-color: #aaaaaa;
  }
  tr:nth-child(even) {
    background-color: #eeeeee;
  }
  td {
    border: 1px solid black;
    text-align: center;
  }
  #in-progress {
    display: none;
  }
  #errors {
    display: none;
    margin: 1em;
    padding: 0.5em;
    border: 1px solid red;
    background-color: #fff0f0;
    color: red;
  }
  #errors h3 {
    margin: 0 0 0.5em 0;
  }
  #errors ul {
    margin: 0;
    padding-left: 1.5em;
  }
</style>
</head>
<body>
<div id=controls>
  <button id=run-tests>Run Tests</button>
  <div id=in-progress>
    <progress id=progress-bar> </progress>
    <span id=progress-label>Benchmark in progress...</span>
  </div>
</div>
<div id=errors>
  <h3>Errors</h3>
  <ul id=error-list></ul>
</div>
<div id=results>
</div>
</body>
</html>
